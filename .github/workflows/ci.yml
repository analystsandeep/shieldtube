name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0 platform-tools'

      - name: Install NDK r27c
        run: |
          # sdkmanager is NOT at $ANDROID_HOME/sdkmanager on a GitHub runner
          # (or in any standard Android SDK layout). Run #1 died with
          #   /usr/local/lib/android/sdk/sdkmanager: No such file or directory
          #   ##[error]Process completed with exit code 127.
          # It lives in cmdline-tools/<latest|version>/bin/sdkmanager. Resolve
          # it instead of hard-coding, print the version, and fail with a clear
          # message if the layout changes again.
          SDKM=$(command -v sdkmanager || true)
          if [ -z "$SDKM" ]; then
            SDKM=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          fi
          if [ -z "$SDKM" ]; then
            echo "::error::sdkmanager not found (PATH or $ANDROID_HOME/cmdline-tools/*/bin/)"
            ls -la "$ANDROID_HOME" "$ANDROID_HOME"/cmdline-tools || true
            exit 1
          fi
          echo "using sdkmanager: $SDKM"
          "$SDKM" --version
          yes | "$SDKM" --install "ndk;27.0.12077973"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"

      - name: Rust 1.99.1 + Android targets
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android
          components: rustfmt, clippy

      - name: cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Rust format / clippy
        working-directory: rust
        run: |
          cargo fmt -- --check
          cargo clippy --all-targets -- -D warnings

      - name: Rust unit tests (step-1 gate)
        run: cargo test --manifest-path rust/Cargo.toml -- --nocapture

      - name: Page-world JS harness (node, no deps)
        run: |
          node --version
          node app/src/test/js/run.js

      - name: Verify vendored lists
        run: bash scripts/verify-checksums.sh app/src/main/assets/lists

      - name: Build all four ABIs
        run: bash scripts/build-rust.sh

      - name: Android lint + JVM/JNI unit tests
        run: ./gradlew lintDebug testDebugUnitTest

      - name: Build APKs
        run: ./gradlew assembleDebug assembleRelease

      - name: Artifact audits (permissions, exported components, delta)
        run: bash scripts/audit-apks.sh

      - name: Verify release signature
        run: |
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify \
            app/build/outputs/apk/release/app-release.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: shieldtube-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: shieldtube-release-apk
          path: app/build/outputs/apk/release/app-release.apk
