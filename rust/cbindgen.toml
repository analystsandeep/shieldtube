# SPDX-License-Identifier: GPL-3.0-or-later
language = "C"
include_guard = "SHIELDTUBE_H"
pragma_once = true
autogen_warning = "/* Generated by cbindgen from rust/src/ffi_c.rs. DO NOT EDIT. */"
tab_width = 4
style = "both"
cpp_compat = true
documentation = true
usize_is_size_t = true
# ffi_c.rs imports ShieldEngine from crate::engine, which this single-file parse
# cannot see. Declare it opaque so the generated header compiles as C/C++.
after_includes = "typedef struct ShieldEngine ShieldEngine;"

[parse]
parse_deps = false

[export]
# Only the stable C ABI is exported. The Java_* symbols are JNI exports and are
# consumed by Kotlin, never by a C caller.
prefix = ""
item_types = ["functions", "opaque", "enums"]

[fn]
args = "auto"

[defines]
